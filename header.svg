<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 230" width="100%" height="230">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0B0F17"/>
      <stop offset="50%" stop-color="#0D1424"/>
      <stop offset="100%" stop-color="#090D15"/>
    </linearGradient>
    <radialGradient id="glow" cx="50%" cy="40%" r="55%">
      <stop offset="0%" stop-color="#38BDF8" stop-opacity="0.14"/>
      <stop offset="60%" stop-color="#818CF8" stop-opacity="0.04"/>
      <stop offset="100%" stop-color="#0B0F17" stop-opacity="0"/>
    </radialGradient>
    <pattern id="grid" width="28" height="28" patternUnits="userSpaceOnUse">
      <circle cx="14" cy="14" r="0.85" fill="#334155" opacity="0.45"/>
    </pattern>
    <linearGradient id="textGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="70%" stop-color="#F1F5F9"/>
      <stop offset="100%" stop-color="#94A3B8"/>
    </linearGradient>
    <linearGradient id="lineGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38BDF8" stop-opacity="0"/>
      <stop offset="25%" stop-color="#38BDF8"/>
      <stop offset="50%" stop-color="#818CF8"/>
      <stop offset="75%" stop-color="#34D399"/>
      <stop offset="100%" stop-color="#34D399" stop-opacity="0"/>
    </linearGradient>
  </defs>

  <!-- Card Background -->
  <rect width="880" height="230" rx="14" fill="url(#bg)" stroke="#1E293B" stroke-width="1.5"/>
  <rect width="880" height="230" rx="14" fill="url(#grid)"/>
  <rect width="880" height="230" rx="14" fill="url(#glow)"/>

  <!-- Top Status Pill -->
  <g transform="translate(440, 44)">
    <rect x="-170" y="-13" width="340" height="26" rx="13" fill="#0F172A" stroke="#1E293B" stroke-width="1"/>
    <circle cx="-150" cy="0" r="3.5" fill="#22C55E"/>
    <circle cx="-150" cy="0" r="7" fill="#22C55E" opacity="0.25"/>
    <text x="-136" y="3.5" fill="#94A3B8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Inter, Roboto, sans-serif" font-size="10.5" font-weight="600" letter-spacing="1.2">AI PLATFORM ENGINEER • PREDIXION AI</text>
  </g>

  <!-- Main Name Title -->
  <text x="440" y="118" text-anchor="middle" fill="url(#textGrad)" font-family="-apple-system, BlinkMacSystemFont, 'SF Pro Display', 'Segoe UI', Inter, sans-serif" font-size="44" font-weight="800" letter-spacing="-0.5">ARPAN SINGHA</text>

  <!-- Subtitle Line 1 -->
  <text x="440" y="152" text-anchor="middle" fill="#94A3B8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Inter, sans-serif" font-size="14" font-weight="400" letter-spacing="0.3">Software Engineer &amp; Data Scientist • IIT Madras × Parul University</text>

  <!-- Subtitle Line 2 -->
  <text x="440" y="178" text-anchor="middle" fill="#64748B" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Inter, sans-serif" font-size="12" font-weight="400" letter-spacing="0.6">Distributed Backends • Geospatial Proximity • Agentic AI Workflows</text>

  <!-- Hairline Bottom Accent -->
  <rect x="80" y="228" width="720" height="1.5" rx="0.75" fill="url(#lineGrad)"/>
</svg>
